<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedy IPTV</title>

    <!-- Tizen WebAPI: must stay a static tag in the packaged page ($WEBAPIS is resolved by the TV runtime) -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>

    <!-- Splash shown while js/boot/loader.js picks the hosted or the bundled app -->
    <style>
        html, body { margin: 0; height: 100%; background: #111827; overflow: hidden; }
        #boot-splash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: #111827; z-index: 10000; }
        #boot-splash img { width: 320px; height: 320px; object-fit: contain; border-radius: 24px; }
    </style>
</head>
<body class="theme-default">
    <div id="boot-splash" aria-hidden="true"><img src="assets/icon_400.jpg" alt=""></div>

    <!-- Loads app.html + app-manifest.json (CSS/JS) from the hosted copy when available, else from this package -->
    <script src="js/boot/loader.js"></script>
</body>
</html>
